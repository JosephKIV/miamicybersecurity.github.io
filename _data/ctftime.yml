# CTFtime results for team MUCTF (https://ctftime.org/team/214233), rendered on /muctf/.
#
# Converted from the Django site's website/ctftime.json. That file used string
# keys ("0", "1") purely as an artifact of the scraper that wrote it; this is a
# plain list, newest season first.
